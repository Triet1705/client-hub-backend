# Value-free Web2 hosted profile. Supply secrets through the platform secret store.
server.address=0.0.0.0
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=none
app.proxy.trusted-addresses=${TRUSTED_PROXY_ADDRESSES}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.flyway.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.flyway.user=${DB_MIGRATION_USER}
spring.flyway.password=${DB_MIGRATION_PASS}
spring.flyway.placeholders.hostedDemo=true
spring.flyway.placeholders.runtimeRole=${DB_RUNTIME_ROLE:clienthub_runtime}

spring.cache.type=none
management.health.redis.enabled=false

ai.enabled=false
blockchain.enabled=false
audit.anchor.enabled=false

file.upload-dir=${FILE_UPLOAD_DIR:/var/clienthub/uploads}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.tenant.require-header=true
app.rls.enabled=true
app.auth.refresh-cookie-secure=true
app.auth.refresh-cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

logging.level.root=INFO
logging.level.com.clienthub=INFO
logging.level.org.hibernate.SQL=WARN
logging.file.name=
